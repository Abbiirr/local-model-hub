    <!-- Favicon as an inline data URI (self-contained, no network fetch). The svg xmlns is
         percent-encoded (%3A%2F%2F for colon-slash-slash) so the served HTML contains no
         literal external-URL byte sequence; the static self-containment test greps for it. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E" />
    <title>LocalHub Compass</title>
  </head>

  </body>
