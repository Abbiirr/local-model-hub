# LocalHub Compass — example configuration.
#
# Every value here is also the built-in default (internal/config.Default), so the daemon
# runs on the reference box (Windows 10, RTX 4060 Ti, llama.cpp + vLLM) with NO
# config file at all. Copy this to configs/config.yaml and edit to override.
#
# Kept in sync with examples/config.example.yaml. Fields new to P1.1 (allow_nonlocal,
# llamacpp.binary_paths, vllm.mode/attach_url, logging.*) are documented inline.

# TWO OPERATING MODES (owner directive 2026-07-25; rationale in docs/security.md
# "Two operating modes"). Other hosts always talk to THIS port (default 39876); engine ports
# (40100+) stay loopback-only so all traffic passes admission + in-flight accounting.
#
#   Mode A — LAN-open, passwordless:  bind 0.0.0.0 + allow_nonlocal true + admin_token null
#     Any host that can reach the port gets FULL ADMIN (start/stop GPU processes, download
#     models). Trusted networks only. 0.0.0.0 publishes on every interface, including any
#     ZeroTier/VPN overlay — not just the Ethernet LAN.
#   Mode B — token enforced (e.g. behind Tailscale Serve): bind 127.0.0.1 + admin_token set
#     Requires `Authorization: Bearer <token>` on every /api/* and /v1/* request.
#
# LIMITATION: admin_token is a SINGLE GLOBAL switch — it cannot be "off for LAN, on for
# Tailscale". Origin-aware auth is unbuilt work (docs/security.md). Pick one mode at a time.
server:
  bind: "127.0.0.1"          # loopback only. Non-loopback binds hard-fail unless allow_nonlocal.
  port: 39876                # the ONLY port other hosts need
  admin_token: null          # optional single bearer token for LAN/headless use (Mode B)
  trust_tailscale_headers: true
  # DANGEROUS: allow binding off 127.0.0.1. LocalHub can free/allocate GPU memory and stop
  # model processes; off-loopback exposes admin controls with no auth by default. Leave false.
  allow_nonlocal: false

data:
  db_path: "./localhub.db"
  model_dirs:
    - "K:\\projects\\llm_models\\models"
  # Where the daemon writes runtime artifacts it owns: per-instance engine log files
  # (P4.2, size-capped). Empty => a "logs" dir beside the DB file.
  data_dir: ""

hardware:
  nvidia: true
  rocm: false
  poll_interval_seconds: 1

engines:
  # Ollama is retired as a runtime. Re-import standalone GGUFs and run them
  # through llama.cpp, which LocalHub can supervise.
  llamacpp:
    enabled: true
    binary_path: "llama-server"   # winget llama-server on PATH (primary candidate)
    # additional ordered fallbacks; the CUDA fork build (fork-only flags — verify per adapter):
    binary_paths:
      - "K:\\projects\\llm_models\\llama.cpp-tq3\\build\\bin\\llama-server.exe"
    # Directories prepended to PATH when probing/spawning the EXPLICIT-path (absolute)
    # candidates above, so their runtime DLLs resolve. The CUDA fork needs the CUDA v12.5
    # bin dir on PATH to load its CUDA DLLs at --version probe time. Applied only to
    # absolute-path binaries; the bare-name winget build on PATH is unaffected.
    extra_path:
      - "K:\\Softwares\\Nvidia GPU Compiling Toolkit\\CUDA\\v12.5\\bin"
    port_range: [40100, 40200]
    # Seconds to wait for a spawned model's /health to answer before FAILED (P4.2). Big
    # models load slowly; default 120.
    health_timeout_seconds: 120
    # Optional already-running single-model llama.cpp servers on this LAN/tailnet.
    # Clients use only the stable id through LocalHub; upstream_model stays upstream-only.
    remote_models: []
    #  - id: "kat"
    #    base_url: "http://192.168.0.157:8080"
    #    upstream_model: "/home/user/models/kat-coder-v2.5.gguf"
  vllm:
    enabled: true
    # vLLM has no native Windows support (PLAN.md resolution 4): use "docker" (spawn
    # container) or "attach" (pre-existing endpoint). "subprocess" is Linux-only.
    mode: "docker"
    binary_path: "vllm"
    attach_url: ""                # required when mode == "attach"
    port_range: [40201, 40300]
    default_gpu_memory_utilization: 0.90
    extra_args: []                 # vLLM engine flags, e.g. ["--skip-mm-profiling"]

compatibility:
  safety_factor: 0.92
  default_context: 8192
  default_batch: 4
  vllm_overhead_mb: 2048

residency:
  enabled: true                  # P5 admission control + eviction + priority queue
  safety_margin_mb: 1024         # additive margin: admit needs free >= footprint + this (PLAN res. 9)
  default_ttl_seconds: 900       # idle TTL for a spawned instance; expired-TTL is evicted first
  never_kill_active_by_default: true
  drain_timeout_seconds: 300     # user-stop of a busy instance drains up to this, then stops anyway
  min_free_ram_mib: 2048         # RAM floor: don't start a new process/warm below this free system RAM
                                 # (RAM binds before VRAM on a small-RAM box; global guard, ram_blocked
                                 # reason surfaced like VRAM shortages; 0 disables). fix 4 / review finding 4.
  max_gpu_temp_c: 87             # GPU-temp ceiling: don't start/warm a new model while the core temp is
                                 # above this (gpu_hot reason; drain re-admits once it cools). RTX 4060 Ti's
                                 # NVIDIA-spec max is 90C and it throttles ~83C, so 87 leaves headroom below
                                 # the hard max. Admission-time guard only — a running model is never killed
                                 # for crossing it. Valid: 0 (disabled) or 60..100.
  max_gpu_util_pct: 0            # GPU-util ceiling: 0 = disabled (starting while the GPU is momentarily busy
                                 # is often legitimate). Set e.g. 80 if the box doubles as a gaming/render
                                 # machine and you want loads to wait for the GPU to be mostly free (gpu_busy
                                 # reason; drain re-admits once it frees). Valid: 0..100.
  queue:                         # custom priority-queue tuning (docs/residency-priority-queue.md)
    age_promote_normal_seconds: 60       # normal → interactive-equivalent after this wait
    age_promote_background_seconds: 120  # background → normal-equivalent after this wait
    coalesce_max: 4              # bounded same-model coalescing (0 disables)
    cap_interactive: 64          # per-class WAITING caps → queue_full rejection past the cap
    cap_normal: 256
    cap_background: 512

jobs:
  enabled: true                  # P6.2 async inference jobs worker (default true; mirrors residency.enabled)

security:
  strict_model_artifact_mode: false
  warn_on_pickle: true
  warn_on_trust_remote_code: true

logging:
  level: "info"                # debug | info | warn | error
  format: "text"               # text | json

cluster:                       # P7.1 LAN federation (ADR-008, docs/cluster-plan.md). OPT-IN.
  role: "off"                  # off (default; byte-identical to single-box 1.0) | coordinator | node
  # --- coordinator role: this box accepts node join/heartbeat and exposes /api/cluster/* ---
  # --- node role: this box dials a coordinator and heartbeats; requires coordinator_url + cluster_token ---
  coordinator_url: ""          # node mode: URL of the coordinator to join, e.g. http://box-a.tailnet.ts.net:39876
  cluster_token: ""            # shared cluster bearer, DISTINCT from server.admin_token. Required for
                               # role=node, and MANDATORY for any clustered role on a non-loopback bind.
  node_name: ""                # human label the coordinator shows (defaults to the OS hostname)
  advertise_url: ""            # node mode: how the coordinator reaches THIS node back (its non-loopback/
                               # tailnet URL). Empty => derived from server.bind:port (fine for a loopback
                               # dev rig; set explicitly for a real second box behind NAT/Tailscale).
  heartbeat_interval_seconds: 10  # node join/heartbeat cadence; the unit ONLINE/STALE/UNREACHABLE derive from
